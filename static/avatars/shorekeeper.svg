<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_shorekeeper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18120c"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent_shorekeeper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Card Background -->
  <rect width="200" height="200" rx="24" fill="url(#bg_shorekeeper)" />
  <rect width="198" height="198" x="1" y="1" rx="23" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.35" />
  
  <!-- Subtle Grid Pattern -->
  <circle cx="100" cy="100" r="52" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.06" />
  
  <!-- Game Themed Graphic -->
  
        <circle cx="100" cy="100" r="68" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
        <circle cx="100" cy="100" r="78" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="3 5" opacity="0.4"/>
        
  
  <!-- Character Center Avatar Orb -->
  <circle cx="100" cy="100" r="42" fill="#0b0f19" stroke="#6366f1" stroke-width="2" />
  <text x="100" y="109" font-family="'Cinzel', 'Shippori Mincho', 'Noto Serif SC', 'PingFang SC', sans-serif" font-weight="bold" font-size="22" fill="url(#accent_shorekeeper)" text-anchor="middle" letter-spacing="1">守岸</text>
  
  <!-- Top Game Badge -->
  <rect x="25" y="12" width="150" height="18" rx="9" fill="rgba(245, 158, 11, 0.2)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="0.8" />
  <text x="100" y="24.5" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#6366f1" text-anchor="middle" letter-spacing="1.5">WUTHERING WAVES</text>
  
  <!-- Bottom Character Full Name -->
  <text x="100" y="165" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">守岸人</text>
</svg>
